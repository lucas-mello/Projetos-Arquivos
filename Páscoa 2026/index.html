<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Feliz Páscoa 2026</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
overflow:hidden;
background-image:url("https://images.unsplash.com/photo-1586015555751-63bb77f4322a");
background-size:cover;
background-position:center;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
overflow:auto;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
text-align:center;
color:#000;
}

h1{
font-size:40px;
}

input{
padding:10px;
font-size:18px;
border-radius:8px;
border:1px solid #aaa;
}

button{
padding:10px 20px;
font-size:18px;
border:none;
border-radius:8px;
background:#000;
color:white;
cursor:pointer;
}

button:hover{
background:#c2185b;
}

.mensagem{
margin-top:30px;
font-size:28px;
line-height:1.7;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
display:none;
}

/* COELHOS */
.coelho{
position:fixed;
top:-60px;
pointer-events:none;
animation:fall linear forwards;
}

/* queda mais suave com leve balanço */
@keyframes fall{
0%{
transform:translateY(0) translateX(0) rotate(0deg);
}
50%{
transform:translateY(50vh) translateX(20px) rotate(10deg);
}
100%{
transform:translateY(110vh) translateX(-10px) rotate(-5deg);
}
}

.falling{
position:fixed;
top:-50px;
font-size:80px;
animation:fall linear forwards;
line-height:1;
}

/* celular */
@media (max-width:600px){
.falling{
font-size:70px;
}
.coelho{
width:110px !important;
}
}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<h1>🐇 Feliz Páscoa 2026 🐇</h1>

<h1>Digite seu nome:</h1>

<input type="text" id="nome">

<br><br>

<button onclick="mostrarMensagem()"><h1>Ver mensagem</h1></button>

<div class="mensagem" id="mensagem"></div>

</div>
</div>

<audio id="somAbertura">
  <source src="Sons/Dia_das_Mulheres.mp3" type="audio/mpeg">
</audio>

<script>

function mostrarMensagem(){

let nome=document.getElementById("nome").value.toUpperCase();;

if(nome.trim()==""){
alert("Digite seu nome");
return;
}

let texto=`🐇 Feliz Páscoa, ${nome}, 🐇 <br><br>

Que esta Páscoa traga muita alegria, amor e renovação para sua vida.<br><br>

Assim como a Páscoa simboliza um novo começo, que você possa renovar suas esperanças e acreditar ainda mais nos seus sonhos.<br><br>

Que nunca faltem motivos para sorrir, abraçar e compartilhar momentos especiais com quem você ama.<br><br>

Que seu caminho seja iluminado, cheio de paz, carinho e muitas conquistas.<br><br>

E claro... que não falte chocolate!<br><br>

Uma Páscoa doce, leve e cheia de felicidade para você!
`;

let msg=document.getElementById("mensagem");

msg.innerHTML=texto;
msg.style.display="block";

}


/* COELHOS FOFOS CAINDO */

function criarCoelho(){

let coelho=document.createElement("img");



/* queda suave */
coelho.style.animationDuration=(6+Math.random()*6)+"s";

/* sempre visível e bonito */
coelho.style.opacity=0.85 + Math.random()*0.15;

/* leve rotação */
coelho.style.transform="rotate("+(-20 + Math.random()*40)+"deg)";

/* tamanhos fofos */
coelho.style.width = (60 + Math.random()*70) + "px";

document.body.appendChild(coelho);

setTimeout(()=>{
coelho.remove();
},12000);

}

setInterval(criarCoelho,500);


/* confete e corações */

function criarElemento(){

const itens=["🐣","☀️","🍫","🎉"];

let el=document.createElement("div");

el.classList.add("falling");

el.innerHTML=itens[Math.floor(Math.random()*itens.length)];

el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(el);

setTimeout(()=>{
el.remove();
},9000);

}

setInterval(criarElemento,600);


/* música */

const audio = document.getElementById("somAbertura");

function tocarSom() {
  audio.volume = 0.5;
  audio.play().catch(() => {});
  document.removeEventListener("click", tocarSom);
}

document.addEventListener("click", tocarSom);

</script>

</body>
</html>
