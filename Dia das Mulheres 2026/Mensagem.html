<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dia das Mulheres</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#ffb6c1,#ffe4e1);
    text-align:center;
    padding-top:100px;
}

h1{
    color:#8b004f;
}

input{
    padding:10px;
    font-size:18px;
    border-radius:8px;
    border:1px solid #999;
}

button{
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#e91e63;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#c2185b;
}

#mensagem{
    margin-top:30px;
    font-size:24px;
    color:#4a004a;
    font-weight:bold;
}
</style>

<script>
function mostrarMensagem(){
    var nome = document.getElementById("nome").value;

    if(nome.trim() == ""){
        alert("Digite seu nome!");
        return;
    }

    document.getElementById("mensagem").innerHTML =
    "🌷 Feliz Dia das Mulheres, " + nome + "! 🌷<br>Você é incrível!";
}
</script>

</head>

<body>

<h1>Mensagem do Dia das Mulheres 🌸</h1>

<p>Digite seu nome:</p>

<input type="text" id="nome" placeholder="Seu nome">

<br><br>

<button onclick="mostrarMensagem()">Ver mensagem</button>

<div id="mensagem"></div>

</body>
</html>
