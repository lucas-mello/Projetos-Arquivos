<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Feliz Dia das Mulheres</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#ffc0cb,#ffe4e1);
    text-align:center;
}

.container{
    position:relative;
    z-index:10;
    margin-top:100px;
}

h1{
    color:#b30059;
}

input{
    padding:10px;
    font-size:18px;
    border-radius:8px;
    border:1px solid #aaa;
}

button{
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#e91e63;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#c2185b;
}

#mensagem{
    margin-top:20px;
    font-size:26px;
    color:#800040;
    font-weight:bold;
}

.flower{
    width:120px;
    margin-top:20px;
}

.falling{
    position:fixed;
    top:-50px;
    font-size:25px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
        opacity:0.8;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>🌷 Dia das Mulheres 🌷</h1>

<p>Digite seu nome:</p>

<input type="text" id="nome">

<br><br>

<button onclick="mostrarMensagem()">Mostrar Mensagem</button>

<div id="mensagem"></div>

<img class="flower" src="https://cdn-icons-png.flaticon.com/512/616/616490.png">

</div>

<script>

function mostrarMensagem(){

let nome = document.getElementById("nome").value;

if(nome.trim()==""){
alert("Digite seu nome!");
return;
}

document.getElementById("mensagem").innerHTML =
"💖 Feliz Dia das Mulheres, "+nome+"! 💖";

}

function criarElemento(){

const itens = ["💖","🌸","🎉"];

let el = document.createElement("div");
el.classList.add("falling");

el.innerHTML = itens[Math.floor(Math.random()*itens.length)];

el.style.left = Math.random()*100+"vw";
el.style.animationDuration = (3 + Math.random()*4) + "s";

document.body.appendChild(el);

setTimeout(()=>{
el.remove();
},7000);

}

setInterval(criarElemento,300);

</script>

</body>
</html>
